name: Daily README Enhancement

# Baut täglich EINE neue, eigenständige Sektion in die awesome-x402 README
# (via Anthropic API) und committet sie auf den Arbeitsbranch.
# Persistenter Ersatz für den In-Session-Cron.

on:
  schedule:
    - cron: "17 7 * * *" # täglich 07:17 UTC
  workflow_dispatch: {} # manueller Trigger

concurrency:
  group: daily-enhance
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET_BRANCH: claude/cron-job-scope-rew8p2

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate new section
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          set -e
          node .github/scripts/daily-enhance.mjs && echo "status=ok" >> "$GITHUB_OUTPUT" || code=$?
          if [ "${code:-0}" = "78" ]; then echo "status=skip" >> "$GITHUB_OUTPUT"; \
          elif [ -n "${code:-}" ]; then exit "$code"; fi

      - name: Commit & push
        if: steps.gen.outputs.status == 'ok'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Add README section: ${{ steps.gen.outputs.title }}"
          # bis zu 4 Versuche mit Backoff
          n=0
          until git push origin HEAD:${TARGET_BRANCH}; do
            n=$((n+1))
            if [ "$n" -ge 4 ]; then echo "push failed after retries" && exit 1; fi
            sleep $((2 ** n))
          done
