name: Build NetWatch APK

on:
  push:
    branches: ["claude/wordpress-necessity-bjdxnu"]
    paths:
      - "netwatch/**"
      - ".github/workflows/netwatch-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: netwatch
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp netwatch/app/build/outputs/apk/debug/app-debug.apk NetWatch.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetWatch-APK
          path: NetWatch.apk

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netwatch-v${{ github.run_number }}
          name: NetWatch APK (Build ${{ github.run_number }})
          body: |
            Netzwerk-Diagnose-App für Android (Debug-Build zum Sideloaden).
            Installation: APK herunterladen, öffnen, "Installation aus unbekannten Quellen" erlauben.
          files: NetWatch.apk
